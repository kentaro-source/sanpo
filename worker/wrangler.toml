name = "sanpo-fit"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Replace this with your KV namespace ID after running:
#   npx wrangler kv:namespace create FIT_KV
# (wrangler will print the id; paste it below)
[[kv_namespaces]]
binding = "FIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Public env vars. Secrets (CLIENT_SECRET) are NOT here — set with:
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
[vars]
GOOGLE_CLIENT_ID = "283060166957-n7v8roliir9nbhiueiolbgimdftjfd1d.apps.googleusercontent.com"
ALLOWED_ORIGIN = "https://kentaro-source.github.io,http://localhost:5173"
